name: Viral Discovery Cron

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/viral-discovery-cron.yml"
      - "packages/discovery/**"
      - "packages/database/**"
      - "apps/worker/**"
      - "config/viral-source-targets.json"
  schedule:
    - cron: "43 */3 * * *"

concurrency:
  group: viral-discovery-cron
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SOURCE_TARGETS_FILE: config/viral-source-targets.json
      # Re-score the active discovery window on every run. A 30-day replay made each cron too slow
      # and delayed noise removal; long historical backfills should be run separately when needed.
      VIRAL_REVALIDATE_HOURS: 48
      # Intentionally omit LLM_API_* here: this workflow is designed to stay $0.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing required GitHub Actions secret: DATABASE_URL"
            exit 1
          fi

      - run: npm install
      - run: npm run build -w @factory/shared
      - run: npm run build -w @factory/database
      - run: npm run build -w @factory/discovery
      - run: npm run build -w @factory/worker
      - name: Test discovery collectors
        run: npm test -w @factory/discovery

      - name: Migrate database
        run: node packages/database/dist/migrate.js

      - name: Sync viral source targets
        run: node apps/worker/dist/sync-targets.js

      - name: Collect Viral Radar core discovery river
        run: |
          node apps/worker/dist/index.js --once --source=hn
          node apps/worker/dist/index.js --once --source=reddit
          node apps/worker/dist/index.js --once --source=official_api
          node apps/worker/dist/index.js --once --source=rss

      - name: Revalidate recent viral candidates with the current entity-quality rules
        run: node apps/worker/dist/revalidate-viral.js
