name: Viral Discovery Cron

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/viral-discovery-cron.yml"
      - "packages/discovery/**"
      - "packages/database/**"
      - "apps/worker/**"
      - "config/viral-source-targets.json"
  schedule:
    - cron: "43 */3 * * *"

concurrency:
  group: viral-discovery-cron
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SOURCE_TARGETS_FILE: config/viral-source-targets.json
      VIRAL_REVALIDATE_HOURS: 48
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      # Intentionally omit LLM_API_* here: entity extraction stays on the free heuristic path.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing required GitHub Actions secret: DATABASE_URL"
            exit 1
          fi

      - run: npm install
      - run: npm run build -w @factory/shared
      - run: npm run build -w @factory/database
      - run: npm run build -w @factory/discovery
      - run: npm run build -w @factory/worker
      - name: Test discovery collectors
        run: npm test -w @factory/discovery

      - name: Migrate database
        run: node packages/database/dist/migrate.js

      - name: Sync viral source targets
        run: node apps/worker/dist/sync-targets.js

      - name: Collect Viral Radar core discovery river
        run: |
          node apps/worker/dist/index.js --once --source=hn --scope=viral
          node apps/worker/dist/index.js --once --source=reddit --scope=viral
          node apps/worker/dist/index.js --once --source=rss --scope=viral

      - name: Collect TikTok Explore trends
        if: env.APIFY_TOKEN != ''
        run: node apps/worker/dist/index.js --once --source=tiktok --scope=viral

      - name: Report TikTok smoke data
        if: env.APIFY_TOKEN != ''
        run: node apps/worker/dist/tiktok-smoke.js

      - name: Note missing TikTok credential
        if: env.APIFY_TOKEN == ''
        run: echo "TikTok skipped because APIFY_TOKEN is not configured."

      - name: Revalidate recent viral candidates with the current entity-quality rules
        run: node apps/worker/dist/revalidate-viral.js
