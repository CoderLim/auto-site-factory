name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Build Cloudflare Pages Function
        run: npx --yes wrangler@4.115.0 pages functions build functions --outfile=/tmp/pages-worker.js --compatibility-date=2026-08-12 --compatibility-flags=nodejs_compat

  ph-temp-pull:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull Product Hunt AI posts for 2026-08-20
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = 'https://vtrrhidkbjfqcqbiaaer.supabase.co/functions/v1/ph-temp-pull-20260821';
          const fixed = {
            k: '98d8797d9f4b42cf8f55d4b351703f1d',
            enc: 'zDvr-AfvOg13r3JMH4DwJqTVa2r8Km_GC3fW1qUXh-XP2uqozEIlZ7l54zdxKRWAcZolftEjd2AEaFk',
            iv: 'a9_k5Vx70fG1zqwy',
          };
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function request(mode, after = null) {
            while (true) {
              const u = new URL(base);
              for (const [k,v] of Object.entries(fixed)) u.searchParams.set(k,v);
              u.searchParams.set('mode', mode);
              if (after) u.searchParams.set('after', after);
              const r = await fetch(u);
              const text = await r.text();
              let j;
              try { j = JSON.parse(text); } catch { throw new Error(`${mode} invalid JSON HTTP ${r.status}: ${text.slice(0,1200)}`); }
              if (r.status === 429) {
                const reset = Number(j?.errors?.[0]?.details?.reset_in ?? 60);
                console.log(`${mode}: rate limited; reset_in=${reset}s`);
                await sleep((Math.max(5, Math.min(reset + 3, 900))) * 1000);
                continue;
              }
              if (!r.ok) throw new Error(`${mode} HTTP ${r.status}: ${text.slice(0,1200)}`);
              if (j.errors) throw new Error(`${mode} GraphQL: ${JSON.stringify(j.errors)}`);
              return j.data.posts;
            }
          }
          (async () => {
            const count = await request('count');
            const allTotalCount = count.totalCount;
            let after = null, aiTotalCount = null, pages = 0;
            const posts = [];
            while (true) {
              const p = await request('ai', after);
              aiTotalCount ??= p.totalCount;
              posts.push(...p.nodes);
              pages++;
              console.log(`ai: page=${pages} fetched=${p.nodes.length} accumulated=${posts.length} total=${aiTotalCount}`);
              if (!p.pageInfo.hasNextPage) break;
              after = p.pageInfo.endCursor;
              if (!after) throw new Error('ai: missing endCursor');
              if (pages > 100) throw new Error('ai: pagination guard exceeded');
            }
            if (posts.length !== aiTotalCount) throw new Error(`ai count mismatch ${posts.length}/${aiTotalCount}`);
            const out = {productHuntDay:'2026-08-20',allTotalCount,aiTopicTotalCount:aiTotalCount,aiFetchedCount:posts.length,aiPages:pages,posts};
            fs.writeFileSync('ph-ai-products-2026-08-20.json', JSON.stringify(out, null, 2));
            console.log(`DONE allTotal=${allTotalCount} ai=${posts.length}/${aiTotalCount}`);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ph-ai-products-2026-08-20
          path: ph-ai-products-2026-08-20.json
          retention-days: 1
