name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Build Cloudflare Pages Function
        run: npx --yes wrangler@4.115.0 pages functions build functions --outfile=/tmp/pages-worker.js --compatibility-date=2026-08-12 --compatibility-flags=nodejs_compat

  ph-temp-pull:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull Product Hunt 2026-08-20
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = 'https://vtrrhidkbjfqcqbiaaer.supabase.co/functions/v1/ph-temp-pull-20260821';
          const fixed = {
            k: '98d8797d9f4b42cf8f55d4b351703f1d',
            enc: 'zDvr-AfvOg13r3JMH4DwJqTVa2r8Km_GC3fW1qUXh-XP2uqozEIlZ7l54zdxKRWAcZolftEjd2AEaFk',
            iv: 'a9_k5Vx70fG1zqwy',
          };
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function requestPage(mode, after) {
            while (true) {
              const u = new URL(base);
              for (const [k,v] of Object.entries(fixed)) u.searchParams.set(k,v);
              u.searchParams.set('mode', mode);
              if (after) u.searchParams.set('after', after);
              const r = await fetch(u);
              const text = await r.text();
              let j;
              try { j = JSON.parse(text); } catch { throw new Error(`${mode} invalid JSON HTTP ${r.status}: ${text.slice(0,1200)}`); }
              if (r.status === 429) {
                const reset = Number(j?.errors?.[0]?.details?.reset_in ?? 60);
                const delay = Math.max(5, Math.min(reset + 3, 900));
                console.log(`${mode}: rate limited; reset_in=${reset}s, retrying after reset`);
                await sleep(delay * 1000);
                continue;
              }
              if (!r.ok) throw new Error(`${mode} proxy HTTP ${r.status}: ${text.slice(0,1200)}`);
              if (j.errors) throw new Error(`${mode} GraphQL: ${JSON.stringify(j.errors)}`);
              return j.data.posts;
            }
          }
          async function pull(mode) {
            let after = null, totalCount = null, page = 0;
            const rows = [];
            while (true) {
              const p = await requestPage(mode, after);
              totalCount ??= p.totalCount;
              rows.push(...p.nodes);
              page++;
              console.log(`${mode}: page=${page} fetched=${p.nodes.length} accumulated=${rows.length} total=${totalCount}`);
              if (!p.pageInfo.hasNextPage) break;
              after = p.pageInfo.endCursor;
              if (!after) throw new Error(`${mode}: missing endCursor`);
              if (page > 100) throw new Error(`${mode}: pagination guard exceeded`);
            }
            return { totalCount, fetchedCount: rows.length, pages: page, rows };
          }
          (async () => {
            const all = await pull('all');
            if (all.fetchedCount !== all.totalCount) throw new Error(`all count mismatch ${all.fetchedCount}/${all.totalCount}`);
            const ai = await pull('ai');
            if (ai.fetchedCount !== ai.totalCount) throw new Error(`ai count mismatch ${ai.fetchedCount}/${ai.totalCount}`);
            const aiRe = /\b(ai|artificial intelligence|agentic|ai agent|agents?|llm|gpt|copilot|chatbot|machine learning|rag|prompt|voice ai|ai voice|ai video|ai image|ai coding|ai code)\b/i;
            const keywordHits = all.rows.filter(p => aiRe.test(`${p.name || ''} ${p.tagline || ''}`));
            const merged = new Map();
            for (const p of ai.rows) merged.set(String(p.id), {...p, source:['topic']});
            for (const p of keywordHits) {
              const id = String(p.id);
              if (merged.has(id)) merged.get(id).source.push('keyword');
              else merged.set(id, {...p, source:['keyword']});
            }
            const out = {
              productHuntDay: '2026-08-20',
              postedAfter: '2026-08-20T06:59:59Z',
              postedBefore: '2026-08-21T07:00:00Z',
              all: {totalCount:all.totalCount,fetchedCount:all.fetchedCount,pages:all.pages,posts:all.rows},
              aiTopic: {totalCount:ai.totalCount,fetchedCount:ai.fetchedCount,pages:ai.pages,posts:ai.rows},
              keywordHitsCount: keywordHits.length,
              mergedAiCandidatesCount: merged.size,
              mergedAiCandidates: [...merged.values()],
            };
            fs.writeFileSync('ph-products-2026-08-20.json', JSON.stringify(out, null, 2));
            console.log(`DONE all=${all.fetchedCount}/${all.totalCount} aiTopic=${ai.fetchedCount}/${ai.totalCount} keywordHits=${keywordHits.length} merged=${merged.size}`);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ph-products-2026-08-20
          path: ph-products-2026-08-20.json
          retention-days: 1
