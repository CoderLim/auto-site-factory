name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Build Cloudflare Pages Function
        run: npx --yes wrangler@4.115.0 pages functions build functions --outfile=/tmp/pages-worker.js --compatibility-date=2026-08-12 --compatibility-flags=nodejs_compat

  ph-temp-pull:
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: temporary Product Hunt relay') }}"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull all Product Hunt posts for 2026-08-20
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = 'https://vtrrhidkbjfqcqbiaaer.supabase.co/functions/v1/ph-temp-pull-20260821';
          const fixed = {
            k: '98d8797d9f4b42cf8f55d4b351703f1d',
            enc: 'zDvr-AfvOg13r3JMH4DwJqTVa2r8Km_GC3fW1qUXh-XP2uqozEIlZ7l54zdxKRWAcZolftEjd2AEaFk',
            iv: 'a9_k5Vx70fG1zqwy',
            first: '100',
          };
          (async () => {
            let after = null, totalCount = null, page = 0;
            const all = [];
            while (true) {
              const u = new URL(base);
              for (const [k,v] of Object.entries(fixed)) u.searchParams.set(k,v);
              if (after) u.searchParams.set('after', after);
              const r = await fetch(u);
              const text = await r.text();
              if (!r.ok) throw new Error(`proxy HTTP ${r.status}: ${text.slice(0,1000)}`);
              const j = JSON.parse(text);
              if (j.errors) throw new Error(JSON.stringify(j.errors));
              const p = j.data.posts;
              totalCount ??= p.totalCount;
              all.push(...p.nodes);
              page++;
              console.log(`page=${page} fetched=${p.nodes.length} accumulated=${all.length} totalCount=${totalCount}`);
              if (!p.pageInfo.hasNextPage) break;
              after = p.pageInfo.endCursor;
              if (!after) throw new Error('missing endCursor');
              if (page > 100) throw new Error('pagination guard exceeded');
            }
            fs.mkdirSync('tmp', { recursive: true });
            fs.writeFileSync('tmp/ph-products-2026-08-20.json', JSON.stringify({ productHuntDay:'2026-08-20', totalCount, fetchedCount:all.length, posts:all }, null, 2));
            console.log(`DONE totalCount=${totalCount} fetchedCount=${all.length}`);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Commit temporary result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/ph-products-2026-08-20.json
          git commit -m "chore: store temporary Product Hunt pull"
          git push
