name: Steam Follower Probe

on:
  pull_request:
    paths:
      - ".github/workflows/follower-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate follower coverage with Community fallback
        shell: bash
        run: |
          node <<'NODE'
          const apps = [4530170,4980030,4825380,4895250,4968280,5069500,5053020,5057400,5075190,5086560,5107070,5098180,5098820,5084590,4892530,4919760,4880390,3893290,4631870,4980520,5000500,5029170,5043190,5044730,5064290,5094050,5090120,5106690,5109640,5110200]
          const headers = { 'user-agent': 'Mozilla/5.0 (compatible; auto-site-factory-follower-probe/0.1)' }
          const get = async (url) => {
            const response = await fetch(url, { headers, redirect: 'follow' })
            return { response, text: await response.text() }
          }
          const parseStore = (html) => {
            const match = html.match(/class=["'][^"']*num_followers[^"']*["'][^>]*>\s*([\d,]+)\s*</i)
            if (!match?.[1]) return null
            const value = Number(match[1].replaceAll(',', ''))
            return Number.isFinite(value) && value >= 0 ? value : null
          }
          const groupIdFromHtml = (html) => html.match(/OpenGroupChat\(\s*['"](\d+)['"]\s*\)/i)?.[1]
            ?? html.match(/steamid[_-]?group[^\d]{0,30}(\d{16,20})/i)?.[1]
            ?? null
          const parseOuterXmlCount = (xml) => {
            const values = [...xml.matchAll(/<memberCount>([\d,]+)<\/memberCount>/gi)]
              .map((match) => Number(match[1].replaceAll(',', '')))
              .filter(Number.isFinite)
            return values.at(-1) ?? null
          }

          let storeOk = 0
          let fallbackOk = 0
          let missing = 0
          for (const appid of apps) {
            const store = await get(`https://store.steampowered.com/dlc/${appid}/?l=english&cc=us`)
            let followers = parseStore(store.text)
            let source = 'store_dlc'
            if (followers == null) {
              const community = await get(`https://steamcommunity.com/app/${appid}/`)
              const gid = groupIdFromHtml(community.text)
              if (gid) {
                const xml = await get(`https://steamcommunity.com/gid/${gid}/memberslistxml/?xml=1`)
                followers = parseOuterXmlCount(xml.text)
                source = 'community_xml'
              }
            }
            if (followers == null) missing += 1
            else if (source === 'store_dlc') storeOk += 1
            else fallbackOk += 1
            console.log(JSON.stringify({ appid, followers, source: followers == null ? null : source }))
            await new Promise((resolve) => setTimeout(resolve, 100))
          }
          const ok = storeOk + fallbackOk
          console.log(JSON.stringify({ total: apps.length, ok, storeOk, fallbackOk, missing, coveragePct: Math.round(ok / apps.length * 1000) / 10 }))
          if (ok / apps.length < 0.95) process.exitCode = 2
          NODE
