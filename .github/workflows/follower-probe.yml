name: Steam Follower Probe

on:
  pull_request:
    paths:
      - ".github/workflows/follower-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Steam follower surfaces
        shell: bash
        run: |
          node <<'NODE'
          const apps = [
            [4534960, 'Dear Passengers'],
            [4570720, 'DragonSword Awakening'],
            [1913120, 'Tears of Metal'],
            [218620, 'PAYDAY 2'],
            [570, 'Dota 2'],
          ]

          const ua = 'Mozilla/5.0 (compatible; auto-site-factory-follower-probe/0.1)'
          const get = async (url) => {
            const r = await fetch(url, {
              headers: {
                'user-agent': ua,
                accept: 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
              },
              redirect: 'follow'
            })
            return { status: r.status, url: r.url, text: await r.text() }
          }

          const number = (value) => value ? Number(value.replaceAll(',', '')) : null
          const memberCountsFromXml = (text) => [...text.matchAll(/<memberCount>([\d,]+)<\/memberCount>/gi)]
            .map((match) => number(match[1]))
          const xmlStat = (text, tag) => number(text.match(new RegExp(`<${tag}>([\\d,]+)</${tag}>`, 'i'))?.[1])
          const memberCountFromHtml = (text) => {
            for (const pattern of [
              /1\s*-\s*\d+\s+of\s+([\d,]+)\s+Members/i,
              /([\d,]+)\s+MEMBERS/i,
              /class=["'][^"']*membercount[^"']*["'][^>]*>[\s\S]{0,100}?([\d,]+)[\s\S]{0,30}?MEMBERS/i,
            ]) {
              const value = number(text.match(pattern)?.[1])
              if (value != null) return value
            }
            return null
          }

          const groupIdFromHtml = (text) => {
            for (const pattern of [
              /OpenGroupChat\(\s*['"](\d+)['"]\s*\)/i,
              /steamid[_-]?group[^\d]{0,30}(\d{16,20})/i,
            ]) {
              const value = text.match(pattern)?.[1]
              if (value) return value
            }
            return null
          }

          const followerEvidence = (text) => {
            const lower = text.toLowerCase()
            const indices = []
            let from = 0
            while ((from = lower.indexOf('followers', from)) !== -1 && indices.length < 8) {
              indices.push(from)
              from += 9
            }
            return indices.map((index) => text.slice(Math.max(0, index - 180), index + 120).replace(/\s+/g, ' '))
          }

          for (const [appid, name] of apps) {
            console.log(`\n=== ${appid} ${name} ===`)

            for (const surface of [
              `https://store.steampowered.com/app/${appid}/?l=english&cc=us`,
              `https://store.steampowered.com/dlc/${appid}/?l=english&cc=us`,
            ]) {
              const store = await get(surface)
              console.log(JSON.stringify({
                surface, status: store.status, finalUrl: store.url, bytes: store.text.length,
                followerEvidence: followerEvidence(store.text)
              }))
            }

            const app = await get(`https://steamcommunity.com/app/${appid}/`)
            const groupId64 = groupIdFromHtml(app.text)
            console.log(JSON.stringify({ surface: 'community-app', status: app.status, finalUrl: app.url, groupId64, bytes: app.text.length }))

            for (const surface of [
              `https://steamcommunity.com/games/${appid}/members`,
              `https://steamcommunity.com/ogg/${appid}/members`,
            ]) {
              const page = await get(surface)
              console.log(JSON.stringify({ surface, status: page.status, finalUrl: page.url, htmlMemberCount: memberCountFromHtml(page.text), bytes: page.text.length }))
            }

            if (groupId64) {
              const xml = await get(`https://steamcommunity.com/gid/${groupId64}/memberslistxml/?xml=1`)
              console.log(JSON.stringify({
                surface: 'gid-members-xml', status: xml.status, finalUrl: xml.url,
                memberCounts: memberCountsFromXml(xml.text),
                membersInChat: xmlStat(xml.text, 'membersInChat'),
                membersInGame: xmlStat(xml.text, 'membersInGame'),
                membersOnline: xmlStat(xml.text, 'membersOnline'),
                bytes: xml.text.length
              }))
            }
          }
          NODE
