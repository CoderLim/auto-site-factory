name: Public Source Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/verify-public-sources.ts"
      - ".github/workflows/public-source-smoke.yml"
      - "package.json"
  pull_request:
    paths:
      - "scripts/verify-public-sources.ts"
      - ".github/workflows/public-source-smoke.yml"
      - "packages/discovery/src/collectors/sitemap*.ts"
      - "package.json"

jobs:
  verify-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run verify:public-sources
