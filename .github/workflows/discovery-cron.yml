name: Discovery Cron

on:
  workflow_dispatch:
  # Self-test the workflow whenever its schedule/config is changed on main.
  # This also gives us an immediate recovery run instead of waiting for cron.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/discovery-cron.yml"
  schedule:
    # GitHub scheduled workflows can occasionally be delayed. Run every four
    # hours at :23 so a delayed/skipped event is less likely to leave sources
    # stale for the 12-hour anomaly window.
    - cron: "23 */4 * * *"

concurrency:
  group: discovery-cron
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SOURCE_TARGETS_FILE: config/source-targets.json
      REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
      REDDIT_USER_AGENT: auto-site-factory/0.1 by CoderLim
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      LLM_API_URL: ${{ secrets.LLM_API_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing required GitHub Actions secret: DATABASE_URL"
            exit 1
          fi

      - run: npm install
      - run: npm run build

      - name: Migrate database
        run: node packages/database/dist/migrate.js

      - name: Sync core source targets
        run: node apps/worker/dist/sync-targets.js

      - name: Sync sitemap-monitor targets
        env:
          SOURCE_TARGETS_FILE: config/sitemap-targets.migrated.json
        run: node apps/worker/dist/sync-targets.js

      - name: Sync wiki.gg discovery target
        env:
          SOURCE_TARGETS_FILE: config/wiki-gg-targets.json
        run: node apps/worker/dist/sync-targets.js

      - name: Run discovery once
        run: node apps/worker/dist/index.js --once
