name: Steam Lifecycle Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/steam-monitor.yml"
      - "apps/worker/src/steam-monitor.ts"
      - "packages/database/src/steam-repository.ts"
      - "migrations/003_steam_lifecycle.sql"
      - "migrations/005_steam_followers.sql"
      - "migrations/006_steam_opportunities.sql"
  schedule:
    # GitHub cron is UTC. Offset from the top of the hour to reduce scheduler contention.
    - cron: "37 * * * *"

concurrency:
  group: steam-lifecycle-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
      STEAM_STORE_CHECK_LIMIT: "200"
      STEAM_FOLLOWER_CHECK_LIMIT: "300"
      STEAM_CCU_CHECK_LIMIT: "300"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing required GitHub Actions secret: DATABASE_URL"
            exit 1
          fi
          if [ -z "$STEAM_WEB_API_KEY" ]; then
            echo "Missing required GitHub Actions secret: STEAM_WEB_API_KEY"
            exit 1
          fi

      - run: npm install
      - run: npm run build

      - name: Migrate database
        run: node packages/database/dist/migrate.js

      - name: Run Steam lifecycle monitor
        run: node apps/worker/dist/steam-monitor.js

      - name: Log recent Steam opportunities
        run: |
          node --input-type=module <<'NODE'
          import { Database, SteamRepository } from './packages/database/dist/index.js'
          const db = new Database()
          try {
            const repository = new SteamRepository(db)
            const games = await repository.listGames({
              since: new Date(Date.now() - 7 * 24 * 60 * 60 * 1000),
              sort: 'ccu',
              limit: 20
            })
            for (const game of games) {
              console.log(`[steam-opportunity] appid=${game.appid} ccu=${game.ccuCurrent ?? 0} reason=${game.opportunityReason ?? 'unknown'} at=${game.opportunityAt ?? game.firstObservedAt} name=${game.name}`)
            }
          } finally {
            await db.close()
          }
          NODE
